
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Acceso SEC 86</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f3f5;text-align:center}
header{background:#173a5e;color:white;padding:18px 10px}
header h1{margin:0;font-size:23px}
header p{margin:5px}
main{max-width:500px;margin:auto;padding:15px}
.tarjeta{background:white;padding:15px;border-radius:14px;margin-bottom:15px;box-shadow:0 2px 8px #bbb}
input,button{width:100%;padding:14px;font-size:17px;margin-top:8px;border-radius:8px}
input{border:1px solid #aaa}
button{background:#173a5e;color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
#cerrar{background:#64748b;font-size:14px}
#reader{width:100%;max-width:360px;margin:0 auto}
#reader video{max-height:300px!important;object-fit:cover}
#resultado{display:none;padding:16px;border-radius:14px;position:fixed;left:10px;right:10px;top:10px;z-index:9999;max-width:460px;margin:0 auto;box-shadow:0 6px 24px rgba(0,0,0,.28)}
.ok{background:#dcfce7;border:3px solid #16a34a}
.retardo{background:#fef3c7;border:3px solid #d97706}
.duplicado{background:#ffedd5;border:3px solid #ea580c}
.error{background:#fee2e2;border:3px solid #dc2626}
#icono{font-size:50px}
#alumno{font-size:25px;font-weight:bold;margin-top:10px}
#grupo,#hora{font-size:26px;margin-top:7px}
#estado{font-size:20px;font-weight:bold;margin-top:8px}
#contador{font-size:18px;font-weight:bold;margin-top:10px;color:#173a5e}
#mensajeLogin{color:#b91c1c;font-weight:bold}
#panelLector{display:none}
</style>
</head>

<body>

<header>
<h1>SECUNDARIA No. 86</h1>
<p>“República de Venezuela”</p>
<p>Turno Vespertino</p>
<p><b>CONTROL DE ACCESO</b></p>
</header>

<main>

<div class="tarjeta" id="panelLogin">
<h2>🔒 ACCESO AUTORIZADO</h2>
<p>Uso exclusivo del personal escolar</p>

<form id="formLogin">
<input type="password" id="password"
placeholder="Contraseña de acceso"
autocomplete="current-password" required>
<button id="btnLogin" type="submit">INGRESAR</button>
</form>

<p id="mensajeLogin"></p>
</div>

<div id="panelLector">

<div class="tarjeta">
<div><b>LECTOR:</b> <span id="idLector"></span></div>
<button id="boton" onclick="iniciar()">📷 ACTIVAR LECTOR QR</button>
<p id="mensajeCamara">Cámara desactivada</p>
<div id="contador">REGISTROS DE ESTA SESIÓN: 0</div>
</div>

<div class="tarjeta">
<div id="reader"></div>
</div>

<button id="cerrar" onclick="cerrarSesion()">CERRAR SESIÓN</button>

</div>

<div id="resultado">
<div id="icono"></div>
<h2 id="mensaje"></h2>
<div id="alumno"></div>
<div id="grupo"></div>
<div id="hora"></div>
<div id="estado"></div>
</div>

</main>

<script>

const SERVIDOR =
"https://hrqitldnajcuulobvebt.supabase.co/functions/v1/lector-web";

let token = sessionStorage.getItem("SEC86_SESION") || "";
let scanner = null;
let procesando = false;
let ultimo = "";
let ultimoTiempo = 0;
let contador = 0;
let audioCtx = null;
let temporizadorResultado = null;

async function solicitar(datos){

  const controlador = new AbortController();

  const timeout = setTimeout(
    () => controlador.abort(), 25000
  );

  try{

    const respuesta = await fetch(SERVIDOR,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(datos),
      signal:controlador.signal,
      cache:"no-store"
    });

    return await respuesta.json();

  }finally{
    clearTimeout(timeout);
  }
}


// AUTENTICACION

document.getElementById("formLogin")
.addEventListener("submit", async function(e){

  e.preventDefault();

  const campo = document.getElementById("password");
  const boton = document.getElementById("btnLogin");
  const mensaje = document.getElementById("mensajeLogin");

  boton.disabled = true;
  mensaje.innerText = "Validando acceso...";

  try{

    const datos = await solicitar({
      action:"login",
      password:campo.value
    });

    if(datos.ok && datos.token){

      token = datos.token;

      sessionStorage.setItem("SEC86_SESION",token);

      campo.value = "";
      mensaje.innerText = "";

      mostrarLector();

    }else{

      mensaje.innerText =
        datos.mensaje || "ACCESO DENEGADO";

    }

  }catch(error){

    mensaje.innerText = "ERROR DE COMUNICACIÓN";

  }finally{

    boton.disabled = false;
    campo.value = "";

  }

});

function mostrarLector(){

  document.getElementById("panelLogin").style.display="none";
  document.getElementById("panelLector").style.display="block";

}

async function volverLogin(mensaje=""){

  token = "";

  sessionStorage.removeItem("SEC86_SESION");

  clearTimeout(temporizadorResultado);

  if(scanner){
    try{
      if(scanner.isScanning) await scanner.stop();
      scanner.clear();
    }catch(e){}
    scanner = null;
  }

  procesando = false;
  ultimo = "";
  ultimoTiempo = 0;
  contador = 0;

  document.getElementById("contador").innerText =
    "REGISTROS DE ESTA SESIÓN: 0";

  document.getElementById("resultado").style.display="none";
  document.getElementById("panelLector").style.display="none";
  document.getElementById("panelLogin").style.display="block";

  document.getElementById("boton").style.display="block";
  document.getElementById("boton").disabled=false;

  document.getElementById("mensajeCamara").innerText =
    "Cámara desactivada";

  document.getElementById("mensajeLogin").innerText = mensaje;

}

async function cerrarSesion(){

  const tokenAnterior = token;

  await volverLogin();

  try{
    await solicitar({
      action:"logout",
      token:tokenAnterior
    });
  }catch(e){}

}


// IDENTIFICADOR DEL LECTOR

function obtenerIdLector(){

  const clave="SEC86_ID_LECTOR";

  let id=localStorage.getItem(clave);

  if(!id || !/^LECTOR-[A-Z0-9]{8}$/.test(id)){

    const aleatorio=Math.random()
      .toString(36).slice(2,6)
      .padEnd(4,"0").toUpperCase();

    const tiempo=Date.now()
      .toString(36).slice(-4).toUpperCase();

    id="LECTOR-"+aleatorio+tiempo;

    localStorage.setItem(clave,id);

  }

  return id;

}

const ID_LECTOR=obtenerIdLector();

document.getElementById("idLector").innerText=ID_LECTOR;

if(token) mostrarLector();


// AUDIO

function prepararAudio(){

  try{

    audioCtx=audioCtx ||
      new (window.AudioContext||window.webkitAudioContext)();

    if(audioCtx.state==="suspended") audioCtx.resume();

    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();

    g.gain.value=0.0001;

    o.connect(g);
    g.connect(audioCtx.destination);

    o.start();
    o.stop(audioCtx.currentTime+0.03);

  }catch(e){}

}

function tono(freq,duracion,inicio=0,vol=0.35){

  try{

    if(!audioCtx) prepararAudio();

    if(audioCtx.state==="suspended") audioCtx.resume();

    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();

    o.frequency.value=freq;
    o.type="square";

    g.gain.setValueAtTime(
      vol,audioCtx.currentTime+inicio
    );

    g.gain.exponentialRampToValueAtTime(
      0.001,audioCtx.currentTime+inicio+duracion
    );

    o.connect(g);
    g.connect(audioCtx.destination);

    o.start(audioCtx.currentTime+inicio);
    o.stop(audioCtx.currentTime+inicio+duracion);

  }catch(e){}

}

function sonidoOk(){
  tono(950,.13,0,.30);
  tono(1450,.16,.15,.30);
}

function sonidoDuplicado(){
  tono(650,.18,0,.32);
  tono(650,.18,.23,.32);
}

function sonidoError(){
  tono(260,.25,0,.38);
  tono(180,.30,.29,.38);
}

function vibrar(patron){
  if(navigator.vibrate) navigator.vibrate(patron);
}


// ACTIVAR CAMARA

async function iniciar(){

  if(!token){
    await volverLogin("INICIE SESIÓN");
    return;
  }

  prepararAudio();

  document.getElementById("boton").disabled=true;

  document.getElementById("mensajeCamara").innerText =
    "Solicitando acceso a la cámara...";

  scanner=new Html5Qrcode("reader");

  try{

    await scanner.start(
      {facingMode:"environment"},
      {
        fps:15,
        qrbox:{width:220,height:220},
        aspectRatio:1.333333
      },
      qrDetectado
    );

    document.getElementById("boton").style.display="none";

    document.getElementById("mensajeCamara").innerText =
      "🟢 LECTOR ACTIVO — ACERQUE LA CREDENCIAL";

  }catch(error){

    document.getElementById("boton").disabled=false;

    document.getElementById("mensajeCamara").innerText =
      "No fue posible activar la cámara";

  }

}


// PROCESAR QR

async function qrDetectado(codigo){

  codigo=codigo.trim();

  if(procesando || !token) return;

  const ahora=Date.now();

  if(codigo===ultimo && ahora-ultimoTiempo<5000) return;

  ultimo=codigo;
  ultimoTiempo=ahora;
  procesando=true;

  const tokenActual=token;

  document.getElementById("mensajeCamara").innerText =
    "🔎 QR LEÍDO — VALIDANDO...";

  try{

    const datos=await solicitar({

      action:"scan",
      token:tokenActual,
      qr:codigo,
      dispositivo:ID_LECTOR

    });

    if(token!==tokenActual) return;

    if(datos.tipo==="NO_AUTORIZADO"){

      await volverLogin(
        "SESIÓN VENCIDA. INGRESE NUEVAMENTE."
      );

      return;

    }

    mostrar(datos);

  }catch(error){

    if(token!==tokenActual) return;

    mostrar({

      ok:false,
      tipo:"ERROR",
      mensaje:"ERROR DE COMUNICACIÓN — VERIFIQUE ANTES DE REESCANEAR"

    });

  }

}


// RESULTADO

function mostrar(datos){

  const caja=document.getElementById("resultado");

  caja.style.display="block";
  caja.className="";

  document.getElementById("alumno").innerText =
    datos.alumno||"";

  document.getElementById("grupo").innerText =
    datos.grupo?"GRUPO "+datos.grupo:"";

  document.getElementById("hora").innerText =
    datos.hora||"";

  document.getElementById("estado").innerText =
    datos.estado||"";

  if(datos.ok){

    contador++;

    document.getElementById("contador").innerText =
      "REGISTROS DE ESTA SESIÓN: "+contador;

    if(datos.estado==="RETARDO"){

      caja.className="retardo";
      document.getElementById("icono").innerText="🟡";

    }else{

      caja.className="ok";
      document.getElementById("icono").innerText="✅";

    }

    document.getElementById("mensaje").innerText =
      "ENTRADA REGISTRADA";

    sonidoOk();
    vibrar([80]);

  }else if(datos.tipo==="DUPLICADO" || datos.duplicado===true){

    caja.className="duplicado";

    document.getElementById("icono").innerText="⚠️";

    document.getElementById("mensaje").innerText =
      "ENTRADA YA REGISTRADA";

    sonidoDuplicado();
    vibrar([160,70,160]);

  }else{

    caja.className="error";

    document.getElementById("icono").innerText="❌";

    document.getElementById("mensaje").innerText =
      datos.mensaje||"CREDENCIAL NO RECONOCIDA";

    sonidoError();
    vibrar([250,80,250]);

  }

  clearTimeout(temporizadorResultado);

  temporizadorResultado=setTimeout(function(){

    caja.style.display="none";

    document.getElementById("mensajeCamara").innerText =
      "🟢 LECTOR ACTIVO — ACERQUE LA CREDENCIAL";

    procesando=false;

  },1400);

}

</script>
</body>
</html>
